[package]
name = "rateguard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Per-source-IPv4 token-bucket rate limiter — a VPP plugin in Rust"

[lib]
name = "rateguard_plugin"
crate-type = ["cdylib"]

[dependencies]
vpp = { path = "../../vpp" }
vpp-sys = { path = "../../vpp-sys" }

[dev-dependencies]
vpp-test = { path = "../../vpp-test" }
oside = { path = "../../../oside" }
