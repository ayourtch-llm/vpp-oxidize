# Daily drift check: install the latest VPP master packages from
# packagecloud.io/fdio/master and build + test vpp-oxidize against them,
# on both x86_64 and aarch64.
#
# What "deviation" gets caught where:
#  - struct layout changes  -> vpp-sys fails to COMPILE (bindgen layout
#    asserts), and debug builds cross-check native accessors against the
#    C shims per packet at RUN time
#  - registration/ABI drift -> plugin fails to load in the e2e tests
#  - behavior drift         -> rateguard e2e assertions fail
#  - binary API drift       -> typed-API test fails msg-id (name+CRC)
#    resolution at connect time

name: vpp-master-drift

on:
  workflow_dispatch:
  schedule:
    # daily, offset from the usual on-the-hour rush
    - cron: "17 4 * * *"

concurrency:
  group: vpp-master-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout vpp-oxidize
        uses: actions/checkout@v4
        with:
          path: vpp-oxidize

      # path dependency: vpp-test expects oside as a sibling checkout
      - name: Checkout oside
        uses: actions/checkout@v4
        with:
          repository: ayourtch/oside
          path: oside

      - name: Install VPP master packages from packagecloud
        run: |
          curl -s https://packagecloud.io/install/repositories/fdio/master/script.deb.sh \
            | sudo bash
          sudo apt-get install -y vpp vpp-dev vpp-plugin-core libvppinfra libvppinfra-dev
          echo "### VPP under test (${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          dpkg -s vpp | grep -E '^Version' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libclang (bindgen)
        run: sudo apt-get install -y libclang-dev clang

      - name: Build and test vpp-oxidize against packaged VPP
        env:
          VPP_PREFIX: /usr
        run: |
          cd vpp-oxidize
          cargo build --workspace
          cargo test --workspace -- --nocapture

      - name: Perf smoke (release plugin, informational)
        env:
          VPP_PREFIX: /usr
        run: |
          cd vpp-oxidize
          cargo build --release --workspace
          cargo test --release -p rateguard --test e2e -- --ignored --nocapture 2>&1 \
            | tee /tmp/perf.out
          echo "### Perf smoke (${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'clocks/pkt' /tmp/perf.out >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload VPP logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vpp-test-logs-${{ matrix.arch }}
          path: /tmp/vpptest-*/vpp.log
          if-no-files-found: ignore
